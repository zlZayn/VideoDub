[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videodub"
version = "0.1.0"
description = "视频音色替换 — 本地 VoxCPM2 音色克隆 + 逐句时长对齐对口型"
requires-python = ">=3.12"
# 轻量核心依赖已声明：pydantic / soundfile / rich 是模块级导入，numpy / httpx 为用例所需；
# 重型后端保持按需安装，待补：faster-whisper>=1.0 / modelscope>=1.18 / voxcpm>=2.0
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pydantic>=2.0",
    "rich>=13.0",
    "soundfile>=0.12",
]

[project.scripts]
videodub = "videodub.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videodub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# pytest 9 移除了 ini 的 basetemp 键，用 addopts 落地同一意图：
# tmp 目录指到工作区 .pytest-tmp/（%TEMP%\pytest-of-* 有 ACL 遗留问题，勿改回）
addopts = "--basetemp=.pytest-tmp"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.uv]
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock` 都会把 uv.lock
# 的 registry 整片改写成镜像源，境外 CI 拉镜像会 tcp 超时、uv sync --frozen 失败。
# 注：`default-index` 字段 uv 0.11 不认（报 unknown field 并整体忽略该节），
# 必须用下面的 [[tool.uv.index]] 表。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
